<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>霸兔饲养基地</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="app-container">
    <div class="hero-box">
        <div class="title-wrapper">
            <img class="main-title-img" src="assets/title-logo.png" alt="霸兔饲养基地">
        </div>
        <div class="subtitle">✦ 赛博试阅处 ✦</div>
        <div class="toggle-slider-box">
            <div class="toggle-option active" data-type="doujin">同人本</div>
            <div class="toggle-option" data-type="short">短篇</div>
        </div>
    </div>

    <div class="bookshelf">
        <div class="section-caption">霸兔饲养员特供 <span id="activeTypeLabel">同人本</span></div>
        <div id="booksGrid" class="grid-books"></div>
    </div>

    <footer class="custom-footer">
        <div class="footer-content">
            <div class="footer-info">
                <div class="footer-social">
                    <div class="social-item">
                        <span class="social-icon">📕</span>
                        <span class="social-label">小红书</span>
                        <span class="social-handle">@你的小红书账号</span>
                    </div>
                    <div class="social-item">
                        <span class="social-icon">🐦</span>
                        <span class="social-label">微博</span>
                        <span class="social-handle">@你的微博账号</span>
                    </div>
                </div>
            </div>
            <div class="footer-qrcode">
                <div class="qrcode-box">
                    <div class="qrcode-placeholder">
                        <svg width="80" height="80" viewBox="0 0 100 100"><rect width="100" height="100" rx="12" fill="#3d1f2c"/><rect x="15" y="15" width="30" height="30" rx="4" fill="#e65c7c"/><rect x="55" y="15" width="30" height="30" rx="4" fill="#e65c7c"/><rect x="15" y="55" width="30" height="30" rx="4" fill="#e65c7c"/><rect x="55" y="55" width="30" height="30" rx="4" fill="#e65c7c"/><rect x="35" y="35" width="30" height="30" rx="4" fill="#ffebf0"/><circle cx="30" cy="30" r="5" fill="#ffebf0"/><circle cx="70" cy="30" r="5" fill="#ffebf0"/><circle cx="30" cy="70" r="5" fill="#ffebf0"/><circle cx="70" cy="70" r="5" fill="#ffebf0"/></svg>
                    </div>
                    <p class="qrcode-label">匿名提问箱<br>扫码留言</p>
                </div>
            </div>
        </div>
        <div class="footer-copyright">
            <p>🚫 严禁下载 · 二次上传 · 二次印刷 🚫</p>
        </div>
    </footer>
</div>

<!-- ═══════════ READER OVERLAY ═══════════ -->
<div id="readerOverlay" class="reader-overlay">
    <div class="reader-modal">
        <!-- Top bar -->
        <div class="reader-topbar">
            <span id="readerTitle" class="reader-book-title"></span>
            <button id="readerClose" class="reader-close-btn" aria-label="关闭">✕</button>
        </div>

        <!-- Book stage -->
        <div class="reader-body">
            <!-- Prev button (left side) -->
            <button id="readerPrev" class="reader-nav-btn reader-nav-prev" aria-label="上一页">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>

            <!-- Pages -->
            <div id="readerStage" class="reader-stage desktop"></div>

            <!-- Next button (right side) -->
            <button id="readerNext" class="reader-nav-btn reader-nav-next" aria-label="下一页">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
        </div>

        <!-- Bottom bar -->
        <div class="reader-bottombar">
            <span id="readerPageInfo" class="reader-page-info"></span>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
